name: Peptidomimetic Stapling Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

    - name: Validate browser script
      run: node --check web/app.js

    - name: Browser logic unit tests
      run: node --test web/app.test.js

    - name: Check installed dependencies and Python syntax
      run: |
        python -m pip check
        python -m compileall -q agents peptido_staple

  container-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build container
      run: docker build -t peptidomimetic-stapling-ci .
    - name: Verify health and representative API request
      run: |
        docker run -d --name peptido-ci -p 8000:8000 -e AUDIT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" peptidomimetic-stapling-ci
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:8000/health
        curl -fsS -H 'Content-Type: application/json' \
          -d '{"task_id":"SMOKE","target_identifier":"PEPTIDE-01","primary_metric":1,"secondary_metric":1}' \
          http://127.0.0.1:8000/api/audit
    - name: Container logs on failure
      if: failure()
      run: docker logs peptido-ci || true
    - name: Clean up
      if: always()
      run: docker rm -f peptido-ci || true
