name: Peptidomimetic Stapling Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

    - name: Validate browser script
      run: node --check web/app.js

    - name: Browser logic unit tests
      run: node --test web/app.test.js

    - name: Check installed dependencies and Python syntax
      run: |
        python -m pip check
        python -m compileall -q agents peptido_staple
