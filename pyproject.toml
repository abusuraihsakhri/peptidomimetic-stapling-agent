[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peptidomimetic-stapling-engine"
version = "2.0.0"
description = "PeptidoStaple: Hydrocarbon Stapled Alpha-Helix Stability & Cell Penetration Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
peptidomimetic-stapling-engine = "peptido_staple.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/peptidomimetic-stapling-agent"
Repository = "https://github.com/abusuraihsakhri/peptidomimetic-stapling-agent.git"
